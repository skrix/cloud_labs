services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:24-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/iot-hub:cached
      - aws-config:/home/node/.aws
      - ${HOME}/.zshrc:/home/node/.zshrc:ro
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: iot_hub
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iot_hub
    volumes:
      - dev-db-data:/var/lib/postgresql/data

volumes:
  aws-config:
  dev-db-data:
