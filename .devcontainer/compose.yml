services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:24-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/iot-hub:cached
      - aws-config:/home/node/.aws
      - ${HOME}/.zshrc:/home/node/.zshrc:ro
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: iot_hub
      JWT_SECRET: 3a490895fb245002bc0aefbdb870b61c81df4b8b131402ff42d56c3309752021
    depends_on:
      - db

  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iot_hub
    volumes:
      - dev-db:/var/lib/postgresql

volumes:
  aws-config:
  dev-db:
